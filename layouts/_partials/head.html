<meta charset="utf-8">
<title>
  {{ if .IsHome }}
    {{ .Site.Title }}
  {{ else }}
    {{ .Title }} | {{ .Site.Title }}
  {{ end }}
</title>

{{ $sassOpts := dict "transpiler" "dartsass" "outputStyle" "compressed" "includePaths" (slice "node_modules") }}
{{ $style := resources.Get "sass/main.scss" | css.Sass $sassOpts | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- htmx 2.x defaults to selfRequestsOnly:true, blocking cross-origin requests (htmx:invalidPath).
     This site's chat widget (#6) and client-capture form (#5) both call a Lambda Function URL
     on a different origin than this site, so this must be disabled - htmx reads this meta tag
     during its own startup, before processing the page. Same pattern as griz.sh's chat widget. -->
<meta name="htmx-config" content='{"selfRequestsOnly": false}'>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.16.3/dist/cdn.min.js" defer></script>
