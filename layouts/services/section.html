{{ define "main" }}
<section class="section">
  <div class="container">
    <h1 class="title is-2">{{ .Title }}</h1>
    {{ with .Content }}<div class="content">{{ . }}</div>{{ end }}

    <div class="columns">
      {{ range .Pages.ByParam "weight" }}
        <div class="column">
          <div class="card">
            <div class="card-content">
              <p class="title is-5"><a href="{{ .RelPermalink }}">{{ .Title }}</a></p>
              <p class="content">{{ .Params.summary }}</p>
              <p class="has-text-weight-semibold">{{ .Params.price }} / {{ .Params.duration }}</p>
            </div>
            <footer class="card-footer">
              <a href="{{ .RelPermalink }}" class="card-footer-item">Details</a>
              <a href="{{ "/book" | relURL }}" class="card-footer-item">Book</a>
            </footer>
          </div>
        </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
