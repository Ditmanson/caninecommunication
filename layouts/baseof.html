<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">

  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{ partial "/head.html" . }}
  </head>
  <body>
    <header>
      {{ partial "/header.html" . }}
    </header>

    <main>
      {{ block "main" . }}{{ end }}
    </main>

    {{ if not .IsHome }}
    <section class="section">
      <div class="container">
        {{ partial "chatWidget.html" . }}
      </div>
    </section>
    {{ end }}

    <footer>
      {{ partial "/footer.html" . }}
    </footer>
  </body>
</html>
