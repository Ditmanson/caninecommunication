baseURL: "https://caninecommunication.com"
title: "Canine Communication"

# Fragment: a chrome-less output format (no baseof, no nav/footer) for a
# single FAQ answer. Opted into per-page via `outputs: ["html", "fragment"]`
# in front matter (see content/faq/*.md) rather than globally, so only FAQ
# entries get one - the htmx accordion in layouts/faq/section.html hx-gets
# this URL instead of shipping every answer in the initial page load.
outputFormats:
  Fragment:
    mediaType: "text/html"
    baseName: "fragment"
    isHTML: true
    isPlainText: false
    noUgly: true

# JSON output of the home page is this site's searchable content index
# (layouts/index.json.json) - the cross-site AI agent's search_site_content
# tool fetches it, same pattern griz.sh already uses for its own chatbot.
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  # Placeholder until Proton Pro is purchased - Proton Calendar's booking
  # pages are standalone hosted links (calendar.proton.me/bookings/...),
  # not embeddable, so swapping this one value is the entire migration.
  protonBookingURL: "#"

  # Placeholder until the client-capture Lambda (lambda/client-capture/,
  # ticket #5) is actually deployed - deliberately deferred until
  # domain/Proton/Stripe setup is done. Swap in the real Function URL
  # (printed by lambda/client-capture/deploy.sh) once it's deployed.
  clientCaptureURL: "#"

  # Placeholder until the chat agent Lambda (lambda/chat-agent/, ticket #6)
  # is actually deployed - same AWS-goes-last deferral as above.
  chatAgentURL: "#"

