baseURL: "https://k9-communication.com"
title: "Canine Communication"

# Fragment: a chrome-less output format (no baseof, no nav/footer) for a
# single FAQ answer. Opted into per-page via `outputs: ["html", "fragment"]`
# in front matter (see content/faq/*.md) rather than globally, so only FAQ
# entries get one - the htmx accordion in layouts/faq/section.html hx-gets
# this URL instead of shipping every answer in the initial page load.
outputFormats:
  Fragment:
    mediaType: "text/html"
    baseName: "fragment"
    isHTML: true
    isPlainText: false
    noUgly: true

# JSON output of the home page is this site's searchable content index
# (layouts/index.json.json) - the cross-site AI agent's search_site_content
# tool fetches it, same pattern griz.sh already uses for its own chatbot.
outputs:
  home:
    - HTML
    - RSS
    - JSON

# No tags or categories on this site; their empty list pages were in the sitemap.
disableKinds: ["taxonomy", "term"]

params:
  # Home page <title> and default search snippet. The home page title is what
  # Google shows for "dog trainer colorado springs", so keep the city in it.
  homeTitle: "Dog Trainer in Colorado Springs, CO"
  description: "In-home dog training in Colorado Springs, Fountain, Pueblo, and surrounding areas. Obedience, recall, reactive dogs, e-collar, and kids. $100/session."

  # Booking hours, shown on Book, Home, and Contact. Must match data/schedule.yaml
  # and BUSINESS_FACTS in lambda/chat-agent/handler.py.
  hours: "Monday&ndash;Thursday 7&ndash;8am and 3:30&ndash;5:30pm, and Friday&ndash;Saturday 7am&ndash;5:30pm"

  # Where booking emails go (Book page).
  bookingEmail: "training@k9-communication.com"

  # Cities served, shown on Book, Home, Contact, and the location FAQ.
  serviceAreas: "Colorado Springs, Fountain, Pueblo, Hanover, Woodland Park, Falcon, Ellicott, Yoder, Calhan, and surrounding areas"

  # Client community (Discord) invite. Only rendered on the unlisted
  # /join-the-pack/ page; never link it elsewhere on the site.
  discordInvite: "https://discord.gg/AvS8RRSgJ"

  # Owner's phone (call or text): shown on Book, Contact, and the home page.
  phone: "406-533-5127"
  phoneTel: "+14065335127"

  # Function URL printed by lambda/client-capture/deploy.sh (ticket #5).
  clientCaptureURL: "https://izq2sccngplmgh3ivhrppgtzmq0yhaoc.lambda-url.us-east-2.on.aws/"

  # Cloudflare Turnstile site key (public) for the chat widget. Empty = no
  # CAPTCHA. Pair with the TURNSTILE_SECRET env var on the chat Lambda.
  turnstileSiteKey: ""

  # Function URL printed by lambda/chat-agent/deploy.sh (ticket #6).
  chatAgentURL: "https://oa76rvb2je37eueepkamcibxgq0pwucn.lambda-url.us-east-2.on.aws/"

  # Stripe payment buttons on the Book page. Off until data/payments.yaml
  # holds live-mode Payment Links; the current links are test mode.
  paymentsLive: false

menu:
  main:
    - identifier: "Services"
      name: "Services"
      url: "/services"
      weight: 10

    - identifier: "Testimonials"
      name: "Testimonials"
      url: "/testimonials"
      weight: 20

    - identifier: "FAQ"
      name: "FAQ"
      url: "/faq"
      weight: 30

    - identifier: "About"
      name: "About"
      url: "/about"
      weight: 40

    - identifier: "Contact"
      name: "Contact"
      url: "/contact"
      weight: 50

    - identifier: "Book"
      name: "Book a Session"
      url: "/book"
      weight: 60

    - identifier: "TrainingRecords"
      name: "Training Records"
      url: "/training-records"
      weight: 70
